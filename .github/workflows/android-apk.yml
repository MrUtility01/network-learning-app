name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runner already has the Android SDK installed.
      # Avoid android-actions/setup-android here: its legacy "tools" package
      # request currently fails because that package no longer exists.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Android SDK configuration
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetworkLearningApp-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
